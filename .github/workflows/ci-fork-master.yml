name: CI fork master

on:
  push:
    branches: [master, fix/fork-ci-master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fork-master-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  fork-master-gate:
    name: fork master / static and unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Keep this gate aligned with scripts/run-gates.ts so build-backed
      # static checks remain one definition.
      - name: Run static gates
        run: pnpm run check:ci:static

      - name: Run unit test suite
        run: pnpm test

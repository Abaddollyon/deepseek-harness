- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                toolUpdate: addition-only
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high
    - id: messages-all-deferred-tools-snapshot
      name: '../../../packages/llm/llm-deepseek/tests/fixtures/all-deferred-tools.ts'

# Our deferred-tool index claims a definition's `deferLoading` unless the
# defer policy excludes it; excluding keeps the request all-deferred for the adapter.
- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    defer:
      exclude: [snapshot_pending]

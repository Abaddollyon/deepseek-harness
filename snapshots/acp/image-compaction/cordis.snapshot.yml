# Keyless replay for the image-compaction scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]
                # Route-priced request images at the provider cap; the small
                # context window turns that visual pressure into an automatic
                # compaction the text-only heuristic would not trigger.
                contextWindow: 11600
                imageRequestTokens: 384

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# Routed pressure on turn two is 10314 tokens; text-only pressure is 7992,
# below the 9280-token threshold. The 128-token retained tail keeps the images
# on turn one (106 context tokens), but permits their replacement on turn two
# (106 context + 20 acknowledgement + 19 instruction tokens). A 256-token
# summary budget admits the 3872-token system-plus-image replay after tools
# and the summarizer instruction consume another 6756 tokens.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    retainTokens: 128
    maxTokens: 256

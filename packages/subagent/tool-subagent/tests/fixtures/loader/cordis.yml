# Test-only composition for structured subagent provider failures through the real Loader.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: mock

- id: scripted-provider
  name: './scripted-provider.mjs'
  config:
    name: mock
    reply: partial child answer
    stopReason: error
    diagnostic: provider quota exhausted on this route
    failure:
      code: QUOTA
